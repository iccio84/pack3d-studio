# Le prove veloci (prove/test_veloci.py) su ogni PR e su ogni unione nel ramo
# della settimana: la lettura della fustella, le misure, il registro delle
# famiglie, lo stato di un lavoro, i lavoratori. Qualche secondo, e nessun
# file dei clienti: quelli stanno nel repository dei casi, e il parco gira la'
# (pack3d-casi, .github/workflows/parco.yml).
name: Prove veloci

on:
  pull_request:
  push:
    branches: [ coda-settimana ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # la PR unita alla sua base e la base: il confine fra POP e pack
          # guarda i file che la PR cambia
          fetch-depth: 2
      # Una PR verso il ramo della settimana o e' del POP o e' dei pack, mai
      # le due cose insieme (regole/pop.md, *Il confine*). Non vale per il
      # rilascio (verso main) ne' per il riallineo (da main)
      - name: Il confine fra POP e pack
        if: github.event_name == 'pull_request' && github.base_ref == 'coda-settimana' && github.head_ref != 'main'
        run: python prove/confini.py HEAD^1 HEAD
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Le dipendenze
        run: pip install -q -r requirements.txt
      - name: Le prove
        run: python -m unittest discover -s prove -p "test_*.py" -v
