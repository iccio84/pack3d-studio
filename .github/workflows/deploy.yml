name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]
  # per rilanciarlo a mano, dal tasto "Run workflow" della pagina Actions
  workflow_dispatch:

jobs:
  deploy:
    # un'immagine con nome e numero: il 5 ottobre 2026 le macchine di GitHub
    # per ubuntu-latest non arrivavano ("not acquired by Runner of type
    # hosted"), e tre pubblicazioni di fila sono state annullate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      # La risorsa della colata e' grafica del cliente: sta nel repository
      # privato dei casi (risorse/colata.png), non in questo. Si aggiunge al
      # codice in un commit che va solo allo Space. Serve il secret CASI_TOKEN,
      # un token di sola lettura di pack3d-casi (DEPLOY.md, *La risorsa della
      # colata*); senza, lo Space parte senza risorsa e la colata fustellata
      # esce com'era prima che ci fosse. /api/ping dice se e' arrivata.
      - name: La risorsa della colata
        env:
          CASI_TOKEN: ${{ secrets.CASI_TOKEN }}
        run: |
          if [ -z "$CASI_TOKEN" ]; then
            echo "::warning::manca il secret CASI_TOKEN: lo Space parte senza la risorsa della colata"
            exit 0
          fi
          curl -fsSL -H "Authorization: Bearer $CASI_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            -o risorse/colata.png \
            https://api.github.com/repos/iccio84/pack3d-casi/contents/risorse/colata.png
          git add -f risorse/colata.png
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Solo per lo Space: la risorsa della colata, dal repository dei casi"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote remove hf 2>/dev/null || true
          git remote add hf https://Iccio:$HF_TOKEN@huggingface.co/spaces/Iccio/Maurizio
          git push --force hf HEAD:main
